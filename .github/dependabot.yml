version: 2
updates:
  # Root package.json — Playwright and serve
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(deps/actions)"
